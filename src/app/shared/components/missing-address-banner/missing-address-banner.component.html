@if (visible()) {
  <div class="address-banner" role="status">
    <ui-icon name="warning" size="md" class="address-banner__icon"></ui-icon>
    <p class="address-banner__text">
      <strong>Your company has no delivery address on file.</strong>
      You can browse products and save drafts, but orders can't be placed until your Starlinger contact adds one.
    </p>
    <button type="button" class="address-banner__close" aria-label="Dismiss" (click)="dismiss()">
      <ui-icon name="x" size="sm"></ui-icon>
    </button>
  </div>
}
