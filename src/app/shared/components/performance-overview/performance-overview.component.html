<div class="performance-overview">
    <div class="performance-overview__header">
        <div class="performance-overview__title">
            <span class="performance-overview__icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M2.5 2.5V17.5H17.5M15.8333 7.5L11.6667 11.6667L8.33333 8.33333L5.83333 10.8333" stroke="#232323" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <h2>Performance overview</h2>
        </div>
        <div class="performance-overview__date-range">
            <form [formGroup]="dateRangeForm">
                <app-date-picker
                    formControlName="dateRange"
                    [isRange]="true"
                    [dateFormat]="'dd-MM-yyyy'"
                    [rangePlaceholder]="'Select date range'"
                    [storageKey]="'performance-overview-dates'">
                </app-date-picker>
            </form>
        </div>
    </div>

    <!-- Loading state with shimmer -->
    <div class="performance-overview__grid" *ngIf="isLoading">
        <div class="performance-overview__card performance-overview__card--skeleton" *ngFor="let i of [1,2,3,4,5,6,7,8]">
            <div class="skeleton skeleton--label"></div>
            <div class="skeleton skeleton--value"></div>
            <div class="skeleton skeleton--percentage"></div>
        </div>
    </div>

    <!-- Error state -->
    <div class="performance-overview__error" *ngIf="error && !isLoading">
        <p>{{ error }}</p>
        <button class="performance-overview__retry-button" (click)="loadPerformanceData()">Retry</button>
    </div>

    <!-- Metrics grid -->
    <div class="performance-overview__grid" *ngIf="!isLoading && !error">
        <div class="performance-overview__card" *ngFor="let metric of metrics">
            <div class="performance-overview__card-label">
                <span>{{ metric.label }}</span>
                <span class="performance-overview__help-icon" [title]="metric.infoTooltip">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6.06 6.00001C6.21674 5.55446 6.5261 5.17875 6.93331 4.9394C7.34051 4.70005 7.81927 4.61264 8.28479 4.69248C8.75031 4.77233 9.17255 5.01436 9.47672 5.3757C9.78089 5.73703 9.94737 6.19435 9.94667 6.66668C9.94667 8.00001 7.94667 8.66668 7.94667 8.66668" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 11.3333H8.00667" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>
            <div class="performance-overview__card-value" [ngClass]="{'performance-overview__card-value--currency': metric.value.toString().includes('€')}">
                {{ metric.value }}
            </div>
            <div class="performance-overview__card-percentage"
                 [ngClass]="{
                   'performance-overview__card-percentage--up': metric.percentage > 0,
                   'performance-overview__card-percentage--down': metric.percentage < 0,
                   'performance-overview__card-percentage--neutral': metric.percentage === 0
                 }">
                <!-- Up arrow -->
                <svg *ngIf="metric.percentage > 0" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M4.66669 6.66667L8.00002 3.33334M8.00002 3.33334L11.3334 6.66667M8.00002 3.33334V12.6667" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 8 8)"/>
                </svg>
                <!-- Down arrow -->
                <svg *ngIf="metric.percentage < 0" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M4.66669 6.66667L8.00002 3.33334M8.00002 3.33334L11.3334 6.66667M8.00002 3.33334V12.6667" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round" transform="rotate(135 8 8)"/>
                </svg>
                <span>{{ metric.percentage | number:'1.2-2' }} %</span>
            </div>
        </div>
    </div>
</div>
