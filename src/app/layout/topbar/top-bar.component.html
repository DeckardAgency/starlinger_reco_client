<div class="top-bar">
  <div class="top-bar__content">
    <div class="top-bar__content-wrapper">
      <div class="top-bar__logo-wrapper">
        <a href="/" class="top-bar__logo">
          <img src="icons/Logo.svg" alt="Starlinger" class="top-bar__logo-img" />
        </a>
      </div>

      <div class="top-bar__search">
        <ui-search
          variant="dark"
          placeholder="Search"
          [suggestions]="searchSuggestions"
          [loading]="searchLoading"
          (search)="onSearch($event)"
          (suggestionSelect)="onSuggestionSelect($event)"
        ></ui-search>
      </div>
    </div>

    <div class="top-bar__actions">
      <!-- Wishlist Button (Customer only) -->
      <button class="top-bar__action-btn" *ngIf="isCustomer" (click)="openWishlist()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 14s-5.5-3.5-5.5-7A3.5 3.5 0 018 4.5 3.5 3.5 0 0113.5 7c0 3.5-5.5 7-5.5 7z" stroke="#FAFAFA" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="top-bar__cart-count" *ngIf="wishlistItemCount > 0">{{ wishlistItemCount }}</span>
      </button>

      <!-- Cart Button (Customer only) -->
      <button class="top-bar__action-btn" *ngIf="isCustomer" (click)="openCart()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 1.333L2 4v9.333a1.333 1.333 0 001.333 1.334h9.334A1.333 1.333 0 0014 13.333V4l-2-2.667H4zM2 4h12M10.667 6.667a2.667 2.667 0 01-5.334 0" stroke="#FAFAFA" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="top-bar__cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>

      <!-- Notification Bell with Dropdown -->
      <div class="top-bar__notification" *ngIf="notificationState$ | async as state">
        <button class="top-bar__action-btn" (click)="toggleNotificationDropdown()" [class.top-bar__action-btn--active]="showNotificationDropdown">
          <svg width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.867 14a1.293 1.293 0 0 0 2.266 0M4 5.333a4 4 0 0 1 8 0c0 4.667 2 6 2 6H2s2-1.333 2-6Z" stroke="#FAFAFA" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="top-bar__notification-badge" *ngIf="state.newResponsesCount > 0">{{ state.newResponsesCount }}</span>
        </button>

        <!-- Notification Dropdown -->
        <div class="top-bar__notification-dropdown" *ngIf="showNotificationDropdown">
          <div class="notification-dropdown">
            <div class="notification-dropdown__header">
              <span class="notification-dropdown__title">Notifications</span>
              <button class="notification-dropdown__close" (click)="closeNotificationDropdown()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            <div class="notification-dropdown__content">
              <!-- New Responses -->
              <div class="notification-dropdown__section" *ngIf="state.newResponsesCount > 0">
                <div class="notification-dropdown__alert">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  </svg>
                  <span>{{ state.newResponsesCount }} new client response{{ state.newResponsesCount !== 1 ? 's' : '' }}</span>
                </div>
                <button class="notification-dropdown__view-btn" (click)="viewAllResponses()">
                  View Responses
                </button>
              </div>

              <div class="notification-dropdown__empty" *ngIf="state.newResponsesCount === 0">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>No new notifications</span>
              </div>

              <!-- Settings -->
              <div class="notification-dropdown__settings">
                <div class="notification-dropdown__setting">
                  <span>Notifications</span>
                  <button
                    class="notification-dropdown__toggle"
                    [class.notification-dropdown__toggle--on]="state.enabled"
                    (click)="toggleNotifications(!state.enabled)">
                    <span class="notification-dropdown__toggle-slider"></span>
                  </button>
                </div>
                <div class="notification-dropdown__setting">
                  <span>Sound</span>
                  <button
                    class="notification-dropdown__toggle"
                    [class.notification-dropdown__toggle--on]="state.soundEnabled"
                    (click)="toggleSound(!state.soundEnabled)">
                    <span class="notification-dropdown__toggle-slider"></span>
                  </button>
                </div>
                <div class="notification-dropdown__setting notification-dropdown__setting--info">
                  <span>Browser permission</span>
                  <span class="notification-dropdown__permission">{{ getPermissionStatus() }}</span>
                </div>
              </div>

              <!-- Test Button -->
              <div class="notification-dropdown__actions">
                <button class="notification-dropdown__test-btn" (click)="testNotification()">
                  Test Notification
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Backdrop to close dropdown -->
        <div class="top-bar__notification-backdrop" *ngIf="showNotificationDropdown" (click)="closeNotificationDropdown()"></div>
      </div>

      <button class="top-bar__action-btn">
        <svg width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 10a1.333 1.333 0 0 1-1.333 1.333h-8L2 14V3.333A1.333 1.333 0 0 1 3.333 2h9.334A1.333 1.333 0 0 1 14 3.333V10Z" stroke="#FAFAFA" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
        <button class="top-bar__hamburger" (click)="toggleMobileMenu()">
            <svg width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 5h14M3 10h14M3 15h14" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
  </div>
</div>
