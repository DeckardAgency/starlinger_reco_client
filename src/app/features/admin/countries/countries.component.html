<div class="countries-page" (click)="closeDropdown()">
  <!-- Page Header with Breadcrumb -->
  <div class="page-header">
    <div class="page-header__breadcrumb">
      <a routerLink="/admin/dashboard" class="page-header__home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 14.667V8h4v6.667M2 6l6-4.667L14 6v7.333a1.334 1.334 0 01-1.333 1.334H3.333A1.334 1.334 0 012 13.333V6z" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <span class="page-header__separator">
        <svg width="1" height="15" viewBox="0 0 1 15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="0.5" y1="0" x2="0.5" y2="15" stroke="#E4E4E7"/>
        </svg>
      </span>
      <span class="page-header__current">Country</span>
    </div>
  </div>

  <!-- List Header -->
  <div class="list-header">
    <div class="list-header__left">
      <!-- Flag icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" class="list-header__icon">
        <path d="M3.33333 12.5002C3.33333 12.5002 4.16667 11.6668 6.66667 11.6668C9.16667 11.6668 10.8333 13.3335 13.3333 13.3335C15.8333 13.3335 16.6667 12.5002 16.6667 12.5002V2.50016C16.6667 2.50016 15.8333 3.33349 13.3333 3.33349C10.8333 3.33349 9.16667 1.66683 6.66667 1.66683C4.16667 1.66683 3.33333 2.50016 3.33333 2.50016V12.5002ZM3.33333 12.5002V18.3335" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="list-header__title">Country list</h1>
      <span class="list-header__count">{{ totalItems() }}</span>
    </div>
    <div class="list-header__right">
      <div class="search-input">
        <svg class="search-input__icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 14L10 10M11.3333 6.66667C11.3333 9.244 9.244 11.3333 6.66667 11.3333C4.08934 11.3333 2 9.244 2 6.66667C2 4.08934 4.08934 2 6.66667 2C9.244 2 11.3333 4.08934 11.3333 6.66667Z" stroke="#71717A" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          placeholder=""
          class="search-input__field"
        />
      </div>
      <button class="btn btn--icon" (click)="onBulkDelete()" *ngIf="hasSelected()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M12.667 4v9.333a1.333 1.333 0 01-1.334 1.334H4.667a1.333 1.333 0 01-1.334-1.334V4m2 0V2.667a1.333 1.333 0 011.334-1.334h2.666a1.333 1.333 0 011.334 1.334V4M6.667 7.333v4M9.333 7.333v4" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn btn--primary" (click)="onAddCountry()">
        <span>Add country</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 3.333v9.334M3.333 8h9.334" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Table Container -->
  <div class="table-container">
    <div class="table-wrapper">
      <!-- Data Table -->
      <ui-data-table
        [columns]="columns"
        [data]="countries()"
        [sortColumn]="sortColumn"
        [sortDirection]="sortDirection"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>
  </div>

  <!-- Table Footer -->
  <div class="table-footer">
    <span class="table-footer__info">Showing 1 to {{ countries().length }} from {{ totalItems() }} results</span>
    <ui-pagination
      [currentPage]="currentPage()"
      [totalItems]="totalItems()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-pagination>
  </div>
</div>

<!-- Checkbox Header Template (with select all dropdown) -->
<ng-template #checkboxHeaderTemplate>
  <div class="checkbox-header-cell">
    <button class="checkbox-btn" (click)="toggleHeaderDropdown($event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 8.66667C8.36819 8.66667 8.66667 8.36819 8.66667 8C8.66667 7.63181 8.36819 7.33333 8 7.33333C7.63181 7.33333 7.33333 7.63181 7.33333 8C7.33333 8.36819 7.63181 8.66667 8 8.66667Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 4C8.36819 4 8.66667 3.70152 8.66667 3.33333C8.66667 2.96514 8.36819 2.66667 8 2.66667C7.63181 2.66667 7.33333 2.96514 7.33333 3.33333C7.33333 3.70152 7.63181 4 8 4Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 13.3333C8.36819 13.3333 8.66667 13.0349 8.66667 12.6667C8.66667 12.2985 8.36819 12 8 12C7.63181 12 7.33333 12.2985 7.33333 12.6667C7.33333 13.0349 7.63181 13.3333 8 13.3333Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="header-dropdown" *ngIf="isHeaderDropdownOpen()" (click)="$event.stopPropagation()">
      <button class="header-dropdown__item" (click)="onSelectAll()">
        <span>Select all</span>
      </button>
      <button class="header-dropdown__item" (click)="onSelectNone()">
        <span>None</span>
      </button>
    </div>
  </div>
</ng-template>

<!-- Checkbox Template (for rows) -->
<ng-template #checkboxTemplate let-row>
  <div class="checkbox-cell">
    <button class="checkbox-btn" (click)="toggleCountrySelection(row); $event.stopPropagation()">
      <svg *ngIf="!row.selected" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="12" height="12" rx="2" stroke="#232323" stroke-width="1.33"/>
      </svg>
      <svg *ngIf="row.selected" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="12" height="12" rx="2" fill="#dc2626" stroke="#dc2626" stroke-width="1.33"/>
        <path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</ng-template>

<!-- European Union Template -->
<ng-template #europeanUnionTemplate let-row>
  <ui-badge 
    [variant]="row.europeanUnion ? 'success' : 'danger'" 
    size="sm">
    {{ row.europeanUnion ? 'Yes' : 'No' }}
  </ui-badge>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <div class="actions-cell">
    <button class="actions-trigger" (click)="toggleDropdown(row.id, $event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 8.66667C8.36819 8.66667 8.66667 8.36819 8.66667 8C8.66667 7.63181 8.36819 7.33333 8 7.33333C7.63181 7.33333 7.33333 7.63181 7.33333 8C7.33333 8.36819 7.63181 8.66667 8 8.66667Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 4C8.36819 4 8.66667 3.70152 8.66667 3.33333C8.66667 2.96514 8.36819 2.66667 8 2.66667C7.63181 2.66667 7.33333 2.96514 7.33333 3.33333C7.33333 3.70152 7.63181 4 8 4Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 13.3333C8.36819 13.3333 8.66667 13.0349 8.66667 12.6667C8.66667 12.2985 8.36819 12 8 12C7.63181 12 7.33333 12.2985 7.33333 12.6667C7.33333 13.0349 7.63181 13.3333 8 13.3333Z" stroke="#232323" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="dropdown-menu" *ngIf="openDropdownId() === row.id" (click)="$event.stopPropagation()">
      <button class="dropdown-menu__item" (click)="onEdit(row)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M11.333 2A1.886 1.886 0 0114 4.667l-9 9-3.667 1 1-3.667 9-9z" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Edit</span>
      </button>
      <button class="dropdown-menu__item dropdown-menu__item--danger" (click)="onDelete(row)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M12.667 4v9.333a1.333 1.333 0 01-1.334 1.334H4.667a1.333 1.333 0 01-1.334-1.334V4m2 0V2.667a1.333 1.333 0 011.334-1.334h2.666a1.333 1.333 0 011.334 1.334V4M6.667 7.333v4M9.333 7.333v4" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Delete</span>
      </button>
    </div>
  </div>
</ng-template>
