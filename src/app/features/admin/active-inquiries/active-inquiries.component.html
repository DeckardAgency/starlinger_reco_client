<div class="active-inquiries-page">
    <!-- Header with Breadcrumb -->
    <header class="page-header">
        <div class="breadcrumb">
            <a routerLink="/admin/dashboard" class="breadcrumb__home" aria-label="Home">
                <svg width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 14.667V8h4v6.667M2 6l6-4.667L14 6v7.333a1.334 1.334 0 0 1-1.333 1.334H3.333A1.334 1.334 0 0 1 2 13.333V6Z" stroke="#232323" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <span class="breadcrumb__separator"></span>
            <span class="breadcrumb__current">Active Inquiries</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="page-content">
        <!-- Section Header -->
        <div class="section-header">
            <div class="section-header__left">
                <span class="section-header__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 7.50008V10.8334M10 14.1667H10.0083M12.5 1.66675H5C4.55798 1.66675 4.13405 1.84234 3.82149 2.1549C3.50893 2.46746 3.33334 2.89139 3.33334 3.33341V16.6667C3.33334 17.1088 3.50893 17.5327 3.82149 17.8453C4.13405 18.1578 4.55798 18.3334 5 18.3334H15C15.442 18.3334 15.866 18.1578 16.1785 17.8453C16.4911 17.5327 16.6667 17.1088 16.6667 16.6667V5.83341L12.5 1.66675Z" stroke="#232323" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <h1 class="section-header__title">Active orders & inquiries</h1>
                <span class="section-header__count">{{ totalCount }}</span>
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" *ngIf="!isLoading">
            <ui-order-card *ngFor="let order of orders" [data]="order"></ui-order-card>
        </div>

        <!-- Loading State -->
        <div class="cards-grid" *ngIf="isLoading">
            <div class="card-skeleton" *ngFor="let i of [1, 2, 3, 4, 5, 6]"></div>
        </div>
    </main>
</div>
