<div class="active-inquiries-page">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="line"
    [items]="[{ label: 'Active orders & inquiries' }]"
  ></ui-breadcrumbs>

  <!-- Main Content -->
  <main class="page-content">
    <!-- Section Header -->
    <ui-list-header
      title="Active orders & inquiries"
      icon="file-warning"
      [count]="totalCount"
      [showSearch]="false"
      [showAddButton]="false"
      [showBulkDeleteButton]="false"
    ></ui-list-header>

    <!-- Cards Grid -->
    <div class="cards-grid" *ngIf="!isLoading">
      <ui-order-card *ngFor="let order of orders" [data]="order"></ui-order-card>
    </div>

    <!-- Loading State -->
    <div class="cards-grid" *ngIf="isLoading">
      <div class="card-skeleton" *ngFor="let i of [1, 2, 3, 4, 5, 6]"></div>
    </div>
  </main>
</div>
