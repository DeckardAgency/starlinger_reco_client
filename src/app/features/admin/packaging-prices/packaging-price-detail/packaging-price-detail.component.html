<div class="packaging-price-detail-page">
  <!-- Page Header with Breadcrumb -->
  <div class="page-header">
    <div class="page-header__breadcrumb">
      <a routerLink="/admin/dashboard" class="page-header__home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 14.667V8h4v6.667M2 6l6-4.667L14 6v7.333a1.334 1.334 0 01-1.333 1.334H3.333A1.334 1.334 0 012 13.333V6z" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <span class="page-header__separator">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 12L10 8L6 4" stroke="#71717A" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <a routerLink="/admin/packaging-prices" class="page-header__link">Packaging prices</a>
      <span class="page-header__separator">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 12L10 8L6 4" stroke="#71717A" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="page-header__current">{{ isEditMode() ? 'Edit' : 'Add new' }}</span>
    </div>
  </div>

  <!-- Detail Header -->
  <div class="detail-header">
    <div class="detail-header__left">
      <button class="back-btn" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="detail-header__title">{{ isEditMode() ? 'Edit option' : 'Add new option' }}</h1>
    </div>
    <div class="detail-header__right">
      <button class="btn btn--secondary" (click)="onDiscard()">
        <span>Discard changes</span>
      </button>
      <button class="btn btn--primary" (click)="onSave()">
        <span>Save</span>
      </button>
    </div>
  </div>

  <!-- Form Content -->
  <div class="form-container">
    <div class="form-card">
      <!-- Size From -->
      <div class="form-field">
        <label class="form-field__label">Size from</label>
        <div class="form-field__input-wrapper">
          <input
            type="number"
            class="form-field__input"
            [value]="packagingPrice().sizeFrom"
            (input)="onSizeFromChange($event)"
          />
        </div>
      </div>

      <!-- Size To -->
      <div class="form-field">
        <label class="form-field__label">Size to</label>
        <div class="form-field__input-wrapper">
          <input
            type="number"
            class="form-field__input"
            [value]="packagingPrice().sizeTo"
            (input)="onSizeToChange($event)"
          />
        </div>
      </div>

      <!-- Price Base -->
      <div class="form-field">
        <label class="form-field__label">Price base</label>
        <div class="form-field__input-wrapper">
          <input
            type="number"
            step="0.01"
            class="form-field__input"
            [value]="packagingPrice().priceBase"
            (input)="onPriceBaseChange($event)"
          />
        </div>
      </div>
    </div>
  </div>
</div>
