<div class="wishlist-overlay" [class.wishlist-overlay--open]="isOpen()" (click)="onScrimClick($event)">
  <div class="wishlist-sheet" [class.wishlist-sheet--open]="isOpen()">
    <!-- Header -->
    <div class="wishlist-sheet__header">
      <div class="wishlist-sheet__title">
        <ui-icon name="heart" size="md"></ui-icon>
        <span>Wishlist</span>
        <div class="wishlist-sheet__count">{{ wishlistItems().length }}</div>
      </div>
      <button class="wishlist-sheet__close" type="button" (click)="closeWishlist()">
        <ui-icon name="x" size="sm"></ui-icon>
      </button>
    </div>

    <!-- Wishlist Items -->
    <div class="wishlist-sheet__items">
      @for (item of wishlistItems(); track item.id) {
        <div class="wishlist-item">
          <div class="wishlist-item__image-wrapper">
            <img [src]="item.imageUrl" [alt]="item.productName" class="wishlist-item__image">
            <ui-favorite-button
              class="wishlist-item__favorite"
              size="sm"
              [active]="true"
            ></ui-favorite-button>
          </div>
          <div class="wishlist-item__info">
            <div class="wishlist-item__details">
              <div class="wishlist-item__code-section">
                <span class="wishlist-item__label">Product code</span>
                <span class="wishlist-item__code">{{ item.productCode }}</span>
              </div>
              <div class="wishlist-item__name-section">
                <span class="wishlist-item__label">Product name</span>
                <span class="wishlist-item__name">{{ item.productName }}</span>
              </div>
            </div>
            <div class="wishlist-item__controls">
              <div class="wishlist-item__divider"></div>
              <div class="wishlist-item__quantity-row">
                <ui-quantity-selector
                  size="sm"
                  [value]="item.quantity"
                  [min]="1"
                  [showInput]="false"
                  (quantityChange)="onQuantityChange(item, $event)"
                ></ui-quantity-selector>
                <button class="wishlist-item__delete" type="button" (click)="removeItem(item)">
                  <ui-icon name="trash" size="lg"></ui-icon>
                </button>
              </div>
              <span class="wishlist-item__price">{{ formatPrice(item.price * item.quantity) }}</span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Footer Actions -->
    <div class="wishlist-sheet__footer">
      <button class="wishlist-sheet__btn wishlist-sheet__btn--back" type="button" (click)="onBackToProducts()">
        <ui-icon name="chevron-left" size="sm"></ui-icon>
        <span>Back to product list</span>
      </button>
      <div class="wishlist-sheet__actions-right">
        <button class="wishlist-sheet__btn wishlist-sheet__btn--show" type="button" (click)="onShowWishlist()">
          <span>Show wishlist</span>
        </button>
        <button class="wishlist-sheet__btn wishlist-sheet__btn--add-to-cart" type="button" (click)="onAddToCart()">
          <span>Add to cart</span>
          <ui-icon name="chevron-right" size="sm"></ui-icon>
        </button>
      </div>
    </div>
  </div>
</div>
