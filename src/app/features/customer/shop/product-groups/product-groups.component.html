<div class="product-groups">
  <!-- Header with Breadcrumbs -->
  <header class="product-groups__header">
    <div class="product-groups__breadcrumb">
      <button class="product-groups__menu-btn" type="button">
        <ui-icon name="menu" size="md"></ui-icon>
      </button>
      <div class="product-groups__separator"></div>
      <ui-breadcrumbs [items]="breadcrumbItems" [showHome]="true" homeRoute="/customer/dashboard" separator="chevron"></ui-breadcrumbs>
    </div>
  </header>

  <!-- List Header -->
  <div class="product-groups__list-header">
    <h1 class="product-groups__title">Product groups</h1>
  </div>

  <!-- Content -->
  <div class="product-groups__content">
    <div class="product-groups__grid">
      @for (group of productGroups(); track trackByGroupId($index, group)) {
        <article class="group-card" [class.group-card--with-image]="group.imageUrl">
          @if (group.imageUrl) {
            <div class="group-card__image-container">
              <img class="group-card__image" [src]="group.imageUrl" [alt]="group.name" />
            </div>
          }
          
          <div class="group-card__content">
            <div class="group-card__info">
              <!-- Group Icon with background -->
              <div class="group-card__icon-container">
                <ui-icon name="grid" size="md" color="#71717A"></ui-icon>
              </div>
              <div class="group-card__text">
                <span class="group-card__label">Product group name</span>
                <span class="group-card__name">{{ group.name }}</span>
              </div>
            </div>
            
            <div class="group-card__info">
              <!-- Hash Icon with background -->
              <div class="group-card__icon-container">
                <ui-icon name="hash" size="md" color="#71717A"></ui-icon>
              </div>
              <div class="group-card__text">
                <span class="group-card__label">Total products</span>
                <span class="group-card__value">{{ group.totalProducts }}</span>
              </div>
            </div>
            
            <button class="group-card__button" type="button" (click)="viewGroup(group.id)">
              <span>View group</span>
              <ui-icon name="chevron-right" size="sm"></ui-icon>
            </button>
          </div>
        </article>
      }
    </div>
  </div>
</div>
