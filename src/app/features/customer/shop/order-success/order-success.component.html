<div class="order-success">
  <div class="order-success__content">
    <!-- Success Icon -->
    <div class="order-success__icon">
      <ui-icon name="check-circle-large" size="lg"></ui-icon>
    </div>

    <!-- Thank You Message -->
    <h1 class="order-success__title">Thanks for placing your Order.</h1>

    <!-- Order Details -->
    <div class="order-success__details">
      <p class="order-success__detail">Order number: {{ orderNumber() }}</p>
    </div>

    <!-- Contact Buttons -->
    <div class="order-success__contact-buttons">
      <button class="order-success__contact-btn" type="button" (click)="callManager()">
        <ui-icon name="phone" size="sm"></ui-icon>
        <span>Call</span>
      </button>
      <button class="order-success__contact-btn" type="button" (click)="emailManager()">
        <ui-icon name="mail" size="sm"></ui-icon>
        <span>E-mail</span>
      </button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="order-success__actions">
    <button class="order-success__btn order-success__btn--outline" type="button" (click)="goToDashboard()">
      <ui-icon name="chevron-left" size="sm"></ui-icon>
      <span>Back to Dashboard</span>
    </button>
    <button class="order-success__btn order-success__btn--primary" type="button" (click)="viewActiveInquiries()">
      <span>View my Orders</span>
      <ui-icon name="chevron-right" size="sm"></ui-icon>
    </button>
  </div>
</div>
