<div class="orders-page" (click)="closeDropdown()">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="line"
    [items]="[{ label: 'History' }]"
    homeRoute="/customer-admin/orders"
  ></ui-breadcrumbs>

  <!-- List Header -->
  <ui-list-header
    title="History"
    [showSearch]="true"
    [showExportButton]="true"
    [showAddButton]="false"
    [searchQuery]="searchQuery"
    (searchQueryChange)="onSearchChange($event)"
    (export)="onExport()"
  ></ui-list-header>

  <!-- Table Container -->
  <div class="table-container">
    <div class="table-wrapper">
      <!-- Tabs Header -->
      <div class="tabs-wrapper">
        <ui-tabs
          [tabs]="tabs"
          [activeTab]="activeTab()"
          (tabChange)="onTabChange($event)"
          variant="underline"
        ></ui-tabs>
      </div>

      <!-- Data Table -->
      <ui-data-table
        [columns]="columns"
        [data]="orders()"
        [sortColumn]="sortColumn"
        [sortDirection]="sortDirection"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>
  </div>

  <!-- Type Template -->
  <ng-template #typeTemplate let-row>
    <ui-badge variant="dark">{{ getTypeLabel(row.type) }}</ui-badge>
  </ng-template>

  <!-- Customer Template -->
  <ng-template #customerTemplate let-row>
    <div class="customer-cell">
      <ui-avatar
        [src]="row.customer.avatar"
        [name]="row.customer.name"
        size="sm"
      ></ui-avatar>
      <span class="customer-name">{{ row.customer.name }}</span>
    </div>
  </ng-template>

  <!-- Status Template -->
  <ng-template #statusTemplate let-row>
    <ui-badge [variant]="getStatusVariant(row.status)">{{ getStatusLabel(row.status) }}</ui-badge>
  </ng-template>

  <!-- Actions Template -->
  <ng-template #actionsTemplate let-row>
    <ui-table-actions-dropdown
      [isOpen]="openDropdownId() === row.id"
      [row]="row"
      [actions]="tableActions"
      (toggle)="toggleDropdown(row.id)"
      (actionClick)="onActionClick($event)"
      (close)="closeDropdown()"
    ></ui-table-actions-dropdown>
  </ng-template>

  <!-- Table Footer -->
  <ui-table-footer
    [showingFrom]="1"
    [showingTo]="orders().length"
    [totalItems]="orders().length"
  ></ui-table-footer>
</div>
