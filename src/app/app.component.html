<div class="app" [class.app--auth-page]="isAuthPage" [class.app--404-page]="is404Page">
  <ng-container *ngIf="!isAuthPage">
    <app-top-bar></app-top-bar>
    <app-sidebar></app-sidebar>
    <app-mobile-menu></app-mobile-menu>
  </ng-container>

  <main
    class="app__main"
    [class.app__main--collapsed]="sidebarService.isCollapsed()"
    [class.app__main--full]="isAuthPage">
    <router-outlet></router-outlet>
  </main>

  <!-- Login Modal Component (deferred: chunk loads on first open; once loaded, the
       inner *ngIf/[isOpen] bindings behave exactly as before) -->
  @defer (when loginModalOpen && !isAuthenticated && !isAuthPage) {
    <app-login-modal
      *ngIf="!isAuthPage"
      [isOpen]="loginModalOpen && !isAuthenticated"
      [allowClose]="false"
      (isOpenChange)="onLoginModalOpenChange($event)"
      (loginSuccess)="onLoginSuccess()">
    </app-login-modal>
  }

  <!-- Cart Popup (Customer only, deferred: chunk loads on first open; the inner *ngIf
       keeps the original mount/unmount-on-toggle behavior) -->
  @defer (when isCustomer && cartService.isCartOpen()) {
    <app-cart
      *ngIf="isCustomer && cartService.isCartOpen()"
      (close)="cartService.closeCart()">
    </app-cart>
  }

  <!-- Wishlist Popup (Customer only, deferred: chunk loads on first open) -->
  @defer (when isCustomer && wishlistService.isWishlistOpen()) {
    <app-wishlist
      *ngIf="isCustomer && wishlistService.isWishlistOpen()"
      (close)="wishlistService.closeWishlist()">
    </app-wishlist>
  }

  <!-- Global Alert/Confirmation Modal -->
  <app-alert></app-alert>
</div>
